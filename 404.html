<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden — NETbrain</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/bilder/favicon-32.png" sizes="32x32">
<style>
  @font-face{font-family:Geist;font-weight:100 900;font-display:swap;src:url('/schriften/geist-latin.woff2') format('woff2')}
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; display:grid; place-items:center; padding:1.25rem; background:radial-gradient(circle farthest-corner at 50% 0%,#191919,#000);
    color:#ffffffb3; font-family:Geist,ui-sans-serif,system-ui,sans-serif; line-height:155%}
  main{max-width:34rem}
  img{display:block; width:180px; height:auto; margin-bottom:2.5rem}
  .augenbraue{display:flex; align-items:center; gap:5px; color:#fff9; letter-spacing:.06em; text-transform:uppercase; font-size:.9375rem; font-weight:500}
  .augenbraue i{width:4px; height:4px; border-radius:100%; background:#14ada6; box-shadow:0 1px 2px #14ada680}
  h1{margin:.9375rem 0 1rem; color:#fff; font-weight:400; font-size:clamp(2rem,6vw,2.5rem); letter-spacing:-.03em; line-height:120%}
  nav{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:2rem}
  a{display:inline-flex; padding:.6875rem 1.125rem; border-radius:.375rem; border:1px solid #ffffff0d; font-size:.9375rem; font-weight:500;
    text-decoration:none; color:#fff; background:#ffffff1a; transition:all .3s}
  a.erst{background:#14ada6; box-shadow:inset 0 4px 12px #ffffff59, 0 4px 12px #0000001a}
  a:hover{opacity:.9}
</style>
</head>
<body>
<main>
  <img src="/bilder/netbrain-logo.png" alt="NETbrain" width="1928" height="352">
  <p class="augenbraue"><i></i>Fehler 404</p>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Vielleicht wurde sie verschoben, oder der Link enthält einen Tippfehler.</p>
  <nav>
    <a class="erst" href="/">Zur Produktseite</a>
    <a href="/doku/">Zur Dokumentation</a>
  </nav>
</main>
</body>
</html>
