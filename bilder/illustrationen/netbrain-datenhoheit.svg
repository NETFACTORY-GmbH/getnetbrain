<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">NETbrain innerhalb der eigenen Infrastruktur</title>
  <desc id="desc">Firmenwissen und verschlüsselte Chatverläufe liegen in der eigenen NETbrain-Installation. Ein eigenes KI-Modell oder ein freigegebener Cloud-Anbieter kann angebunden werden.</desc>
