      <g fill="#bbb" font-size="11"><text x="56" y="90">Mitarbeiter</text><text x="56" y="162">Kurator</text></g>
      <g fill="#6f6f6f" font-size="9"><text x="56" y="103">Lesen &amp; beitragen</text><text x="56" y="175">Prüfen &amp; freigeben</text></g>
