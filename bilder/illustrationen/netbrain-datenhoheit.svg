    <path d="M192 210h54" stroke="#1bccc4" stroke-width="1.5"/><circle cx="219" cy="210" r="4" fill="#1bccc4"/>
    <rect x="238" y="70" width="286" height="300" rx="14" fill="#1bccc4" opacity=".08" filter="url(#g)"/>
    <g transform="translate(240 64)">
