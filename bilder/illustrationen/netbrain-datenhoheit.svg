    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern>
  </defs>
  <rect width="720" height="440" fill="url(#grid)"/>
  <g font-family="Arial,Helvetica,sans-serif">
