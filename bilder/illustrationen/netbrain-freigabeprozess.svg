<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Vier Schritte vom Beitrag zum geprüften Wissen</title>
  <desc id="desc">Ein Beitrag wird eingereicht, durch KI aufbereitet, von einem Kurator geprüft und anschließend im Firmenwissen freigegeben.</desc>
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202020"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="960" height="390" fill="url(#grid)"/>
  <path d="M118 195H842" stroke="#fff" stroke-opacity=".1" stroke-dasharray="4 7"/>
  <g fill="#1bccc4"><circle cx="230" cy="195" r="4"/><circle cx="480" cy="195" r="4"/><circle cx="730" cy="195" r="4"/></g>
  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(28 34)">
      <rect width="204" height="310" rx="10" fill="url(#p)" stroke="#fff" stroke-opacity=".1"/>
      <rect x="16" y="16" width="78" height="24" rx="12" fill="#171717" stroke="#fff" stroke-opacity=".13"/><circle cx="30" cy="28" r="3" fill="#1bccc4"/><text x="40" y="32" fill="#bbb" font-size="11">01 · Beitrag</text>
      <text x="16" y="70" fill="#fff" font-size="16">Wissen einreichen</text><text x="16" y="90" fill="#818181" font-size="11">Text, Link oder Bild hinzufügen</text>
      <g transform="translate(35 125)"><rect width="134" height="112" rx="7" fill="#111" stroke="#fff" stroke-opacity=".12"/><rect x="16" y="17" width="102" height="13" rx="3" fill="#1c1c1c"/><path d="M21 23h45" stroke="#606060" stroke-width="3" stroke-linecap="round"/><rect x="16" y="44" width="102" height="40" rx="4" fill="#171717" stroke="#fff" stroke-opacity=".08"/><path d="M26 72l15-16 12 11 13-13 25 26" fill="none" stroke="#1bccc4" stroke-opacity=".7"/><circle cx="88" cy="55" r="4" fill="#92e188"/><rect x="16" y="94" width="72" height="5" rx="2" fill="#333"/></g>
      <rect x="35" y="256" width="134" height="31" rx="5" fill="#1bccc4" fill-opacity=".12" stroke="#1bccc4" stroke-opacity=".3"/><text x="102" y="276" fill="#1bccc4" font-size="11" text-anchor="middle">Zur Aufbereitung</text>
    </g>
    <g transform="translate(268 34)">
      <rect width="204" height="310" rx="10" fill="url(#p)" stroke="#fff" stroke-opacity=".1"/>
      <rect x="16" y="16" width="96" height="24" rx="12" fill="#171717" stroke="#fff" stroke-opacity=".13"/><circle cx="30" cy="28" r="3" fill="#1bccc4"/><text x="40" y="32" fill="#bbb" font-size="11">02 · Entwurf</text>
      <text x="16" y="70" fill="#fff" font-size="16">KI strukturiert</text><text x="16" y="90" fill="#818181" font-size="11">Titel, Zusammenfassung, Tags</text>
      <circle cx="102" cy="181" r="65" fill="#1bccc4" opacity=".1" filter="url(#g)"/>
      <g transform="translate(42 116)"><rect width="120" height="139" rx="7" fill="#161616" stroke="#1bccc4" stroke-opacity=".35"/><rect x="15" y="16" width="58" height="7" rx="3" fill="#1bccc4" fill-opacity=".7"/><path d="M15 41h89M15 52h78M15 63h84M15 87h91M15 98h66" stroke="#505050" stroke-width="4" stroke-linecap="round"/><g transform="translate(15 115)"><rect width="32" height="14" rx="7" fill="#1bccc4" fill-opacity=".14"/><rect x="38" width="40" height="14" rx="7" fill="#92e188" fill-opacity=".12"/></g></g>
      <text x="102" y="280" fill="#92e188" font-size="11" text-anchor="middle">Entwurf fertig zur Prüfung</text>
    </g>
    <g transform="translate(508 34)">
      <rect width="204" height="310" rx="10" fill="url(#p)" stroke="#fff" stroke-opacity=".1"/>
      <rect x="16" y="16" width="91" height="24" rx="12" fill="#171717" stroke="#fff" stroke-opacity=".13"/><circle cx="30" cy="28" r="3" fill="#92e188"/><text x="40" y="32" fill="#bbb" font-size="11">03 · Prüfung</text>
      <text x="16" y="70" fill="#fff" font-size="16">Kurator entscheidet</text><text x="16" y="90" fill="#818181" font-size="11">prüfen, ergänzen, freigeben</text>
      <g transform="translate(25 120)"><rect width="154" height="119" rx="8" fill="#111" stroke="#fff" stroke-opacity=".12"/><circle cx="33" cy="32" r="15" fill="#1c1c1c" stroke="#fff" stroke-opacity=".12"/><path d="M27 33l4 4 8-10" fill="none" stroke="#92e188" stroke-width="2.5"/><text x="57" y="29" fill="#fff" font-size="12">Inhalt geprüft</text><text x="57" y="45" fill="#777" font-size="10">fachlich korrekt</text><path d="M16 64h122" stroke="#fff" stroke-opacity=".08"/><circle cx="28" cy="84" r="4" fill="#1bccc4"/><text x="41" y="88" fill="#aaa" font-size="10">Verantwortung gesetzt</text><circle cx="28" cy="103" r="4" fill="#1bccc4"/><text x="41" y="107" fill="#aaa" font-size="10">Prüftermin gesetzt</text></g>
      <rect x="25" y="257" width="154" height="31" rx="5" fill="#92e188" fill-opacity=".12" stroke="#92e188" stroke-opacity=".3"/><text x="102" y="277" fill="#92e188" font-size="11" text-anchor="middle">Freigeben</text>
    </g>
    <g transform="translate(748 34)">
      <rect width="184" height="310" rx="10" fill="url(#p)" stroke="#92e188" stroke-opacity=".22"/>
      <rect x="16" y="16" width="105" height="24" rx="12" fill="#171717" stroke="#fff" stroke-opacity=".13"/><circle cx="30" cy="28" r="3" fill="#92e188"/><text x="40" y="32" fill="#bbb" font-size="11">04 · Veröffentlicht</text>
      <text x="16" y="70" fill="#fff" font-size="16">Gemeinsam nutzbar</text><text x="16" y="90" fill="#818181" font-size="11">auffindbar für das ganze Team</text>
      <g transform="translate(22 120)"><rect x="10" y="12" width="130" height="108" rx="7" fill="#111" stroke="#fff" stroke-opacity=".08"/><rect x="5" y="6" width="130" height="108" rx="7" fill="#151515" stroke="#fff" stroke-opacity=".1"/><rect width="130" height="108" rx="7" fill="#1a1a1a" stroke="#fff" stroke-opacity=".13"/><path d="M17 24h73M17 38h96M17 52h82M17 75h92M17 89h52" stroke="#535353" stroke-width="4" stroke-linecap="round"/><circle cx="111" cy="89" r="13" fill="#92e188"/><path d="M105 89l4 4 8-9" fill="none" stroke="#09110a" stroke-width="2.5"/></g>
      <g transform="translate(22 259)"><circle cx="6" cy="6" r="5" fill="#1bccc4"/><text x="18" y="10" fill="#aaa" font-size="10">Suche</text><circle cx="73" cy="6" r="5" fill="#92e188"/><text x="85" y="10" fill="#aaa" font-size="10">KI-Chat</text></g>
    </g>
  </g>
</svg>
