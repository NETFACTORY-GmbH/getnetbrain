<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Vom einzelnen Beitrag zum gemeinsamen Firmenwissen</title>
  <desc id="desc">Texte, Links und Bilder werden aufbereitet, geprüft und anschließend über Suche und KI-Chat genutzt.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202020"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1bccc4"/><stop offset="1" stop-color="#107d78"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="720" height="440" fill="url(#grid)" opacity=".75"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="38" y="46" fill="#8f8f8f" font-size="12" letter-spacing="1.5">BEITRÄGE</text>
    <text x="286" y="46" fill="#8f8f8f" font-size="12" letter-spacing="1.5">FIRMENWISSEN</text>
    <text x="578" y="46" fill="#8f8f8f" font-size="12" letter-spacing="1.5">NUTZUNG</text>

    <g transform="translate(28 78)">
      <rect width="180" height="66" rx="8" fill="url(#panel)" stroke="#fff" stroke-opacity=".11"/>
      <rect x="14" y="15" width="36" height="36" rx="7" fill="#161616" stroke="#fff" stroke-opacity=".12"/>
      <path d="M25 24h14M25 30h14M25 36h9" stroke="#1bccc4" stroke-width="2" stroke-linecap="round"/>
      <text x="62" y="29" fill="#fff" font-size="14">Text &amp; Notizen</text><text x="62" y="47" fill="#858585" font-size="11">Erfahrung festhalten</text>
    </g>
    <g transform="translate(28 161)">
      <rect width="180" height="66" rx="8" fill="url(#panel)" stroke="#fff" stroke-opacity=".11"/>
      <rect x="14" y="15" width="36" height="36" rx="7" fill="#161616" stroke="#fff" stroke-opacity=".12"/>
      <path d="M26 35l9-9m-4 1 3-3a6 6 0 018 8l-3 3m-6-2-3 3a6 6 0 01-8-8l3-3" fill="none" stroke="#92e188" stroke-width="2" stroke-linecap="round"/>
      <text x="62" y="29" fill="#fff" font-size="14">Links &amp; Quellen</text><text x="62" y="47" fill="#858585" font-size="11">Kontext übernehmen</text>
    </g>
    <g transform="translate(28 244)">
      <rect width="180" height="66" rx="8" fill="url(#panel)" stroke="#fff" stroke-opacity=".11"/>
      <rect x="14" y="15" width="36" height="36" rx="7" fill="#161616" stroke="#fff" stroke-opacity=".12"/>
      <rect x="23" y="24" width="18" height="17" rx="2" fill="none" stroke="#1bccc4" stroke-width="2"/><circle cx="36" cy="29" r="2" fill="#92e188"/><path d="M25 38l5-5 4 4 3-3 4 4" fill="none" stroke="#1bccc4" stroke-width="1.5"/>
      <text x="62" y="29" fill="#fff" font-size="12.5">Bilder &amp; Dokumente</text><text x="62" y="47" fill="#858585" font-size="11">Inhalte erfassen</text>
    </g>

    <g stroke="#1bccc4" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M208 111h43v60h25"/><path d="M208 194h68"/><path d="M208 277h43v-60h25"/>
    </g>
    <g fill="#1bccc4"><circle cx="251" cy="111" r="3"/><circle cx="251" cy="277" r="3"/><circle cx="276" cy="194" r="3"/></g>
    <circle cx="342" cy="194" r="78" fill="#1bccc4" opacity=".09" filter="url(#glow)"/>
    <g transform="translate(276 88)">
      <rect width="156" height="212" rx="12" fill="url(#panel)" stroke="#1bccc4" stroke-opacity=".55"/>
      <rect x="14" y="14" width="128" height="25" rx="12" fill="#1bccc4" fill-opacity=".09" stroke="#1bccc4" stroke-opacity=".22"/>
      <circle cx="29" cy="26.5" r="4" fill="#92e188"/><text x="40" y="30" fill="#c8c8c8" font-size="10">geprüft &amp; freigegeben</text>
      <g transform="translate(31 59)">
        <rect x="12" y="12" width="70" height="88" rx="5" fill="#111" stroke="#fff" stroke-opacity=".12"/>
        <rect x="6" y="6" width="70" height="88" rx="5" fill="#151515" stroke="#fff" stroke-opacity=".14"/>
        <rect width="70" height="88" rx="5" fill="#1a1a1a" stroke="#fff" stroke-opacity=".18"/>
        <path d="M14 20h35M14 31h43M14 42h31M14 61h42M14 71h24" stroke="#757575" stroke-width="3" stroke-linecap="round"/>
        <circle cx="60" cy="76" r="13" fill="url(#aqua)"/><path d="M54 76l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="78" y="181" fill="#fff" font-size="16" text-anchor="middle">Firmenwissen</text>
      <text x="78" y="198" fill="#858585" font-size="11" text-anchor="middle">offene Markdown-Dateien</text>
    </g>

    <path d="M432 194h53" stroke="#1bccc4" stroke-width="1.5"/><circle cx="485" cy="194" r="3" fill="#1bccc4"/>
    <g transform="translate(485 116)">
      <rect width="207" height="70" rx="8" fill="url(#panel)" stroke="#fff" stroke-opacity=".11"/>
      <circle cx="30" cy="35" r="15" fill="#1bccc4" fill-opacity=".12" stroke="#1bccc4" stroke-opacity=".35"/>
      <circle cx="28" cy="33" r="6" fill="none" stroke="#1bccc4" stroke-width="2"/><path d="M33 38l5 5" stroke="#1bccc4" stroke-width="2"/>
      <text x="56" y="31" fill="#fff" font-size="14">Suche ohne KI</text><text x="56" y="49" fill="#858585" font-size="11">schnell und ohne Kontingent</text>
    </g>
    <g transform="translate(485 202)">
      <rect width="207" height="70" rx="8" fill="url(#panel)" stroke="#fff" stroke-opacity=".11"/>
      <circle cx="30" cy="35" r="15" fill="#92e188" fill-opacity=".1" stroke="#92e188" stroke-opacity=".32"/>
      <path d="M23 29h14v10H29l-4 4v-4h-2z" fill="none" stroke="#92e188" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="56" y="31" fill="#fff" font-size="14">KI-Chat</text><text x="56" y="49" fill="#858585" font-size="11">Antworten mit Firmenwissen</text>
    </g>
    <g transform="translate(485 288)">
      <rect width="207" height="50" rx="8" fill="#111" stroke="#fff" stroke-opacity=".08"/>
      <circle cx="22" cy="25" r="4" fill="#92e188"/><text x="36" y="29" fill="#aaa" font-size="11">Anbieter und Rechte frei wählbar</text>
    </g>
  </g>
</svg>
